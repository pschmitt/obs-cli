name: GitHub Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Generate the changelog without creating a release.
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: pschmitt/ci-workflows/.github/workflows/github-release.yaml@main
    with:
      dry-run: ${{ inputs.dry-run || false }}
    permissions:
      contents: write
